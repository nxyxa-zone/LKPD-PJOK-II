<!DOCTYPE html>
<html lang="id">
<head>

    <title>PJOK: Rhythmic Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0f172a', /* Navy Gelap */
                        accent: '#f97316', /* Oranye Sporty */
                        action: '#3b82f6', /* Biru Terang */
                        success: '#10b981',
                        danger: '#ef4444',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        head: ['Teko', 'sans-serif'],
                    }

        }

        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        .active-mission { border-left: 5px solid #f97316; background: #e2e8f0; color: #0f172a; }
        .inactive-mission { border-left: 5px solid transparent; opacity: 0.7; }
        
        .task-checkbox:checked + div { background-color: #dcfce7; border-color: #22c55e; }
        .task-checkbox:checked + div span { color: #15803d; text-decoration: none; font-weight: bold; }

</head>
<body class="bg-slate-900 font-sans text-slate-200 min-h-screen flex justify-center">

            <div class="relative z-10">

        </section>

            <!-- Tab Navigasi -->
            <div class="sticky top-0 bg-white z-30 px-4 py-3 shadow-md border-b border-slate-200 flex gap-2 overflow-x-auto shrink-0 no-scrollbar">
                <button onclick="loadMission(1)" id="btn-1" class="flex-1 min-w-[100px] py-2 px-3 rounded-lg text-left transition-all active-mission group">

                    <span class="font-head text-xl font-bold leading-none text-brand">TEKNIK DASAR</span>
                </button>
                <button onclick="loadMission(2)" id="btn-2" class="flex-1 min-w-[100px] py-2 px-3 rounded-lg text-left transition-all inactive-mission group">

                    <span class="font-head text-xl font-bold leading-none text-brand">KOMBINASI</span>

                <button onclick="loadMission(3)" id="btn-3" class="flex-1 min-w-[100px] py-2 px-3 rounded-lg text-left transition-all inactive-mission group">

                    </div>
                    
                    <!-- Area Video -->

                    </div>
                    
                    <div class="p-4 bg-slate-50 border-t border-slate-100">
                        <p id="mission-desc" class="text-sm text-slate-600 leading-relaxed font-medium">Deskripsi...</p>
                    </div>
                </div>

                <div class="bg-brand text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
                    <div class="flex items-center gap-2 mb-3 border-b border-slate-700 pb-2">
                        <i class="fas fa-book-reader text-accent"></i>
                        <h3 class="font-head text-2xl tracking-wide">BEDAH VIDEO</h3>
                    </div>
                    <div id="mission-theory" class="text-sm space-y-4 font-light text-slate-200 leading-relaxed">
                        <!-- JS Injected -->
                    </div>
                </div>

                            </div>

                    <label class="flex items-center gap-2 font-bold text-brand text-lg uppercase mb-2">

                    <span class="text-green-100 text-xs font-sans font-bold tracking-widest uppercase">Misi Selesai?</span>
                    <div class="flex items-center gap-2">
                        <span>KIRIM LAPORAN</span>
                        <i class="fab fa-whatsapp text-2xl group-hover:scale-110 transition-transform"></i>
                    </div>
                </button>
            </div>
        </main>
    </div>

        let score = 0;

        // --- INIT & NAV ---
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if(document.getElementById('nama').value) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                document.getElementById('main-content').classList.add('flex');
                loadMission(1);
            }
        });

        function loadMission(id) {
            activeMission = id;
            const data = missions[id];
            
            // Tab UI update
            [1,2,3].forEach(i => {
                const btn = document.getElementById(`btn-${i}`);
                if(i === id) { btn.classList.add('active-mission'); btn.classList.remove('inactive-mission'); }
                else { btn.classList.remove('active-mission'); btn.classList.add('inactive-mission'); }
            });

            // Content update
            document.getElementById('mission-title').innerText = data.title;
            
            // Inject Iframe with Start Time
            const mediaContainer = document.getElementById('media-container');
            // Construct YouTube Embed URL with Start Time
            const src = `https://www.youtube.com/embed/${data.videoId}?start=${data.start}&rel=0`;
            mediaContainer.innerHTML = `<iframe class="w-full h-full" src="${src}" frameborder="0" allowfullscreen></iframe>`;
            
            document.getElementById('mission-desc').innerHTML = data.desc;
            document.getElementById('mission-theory').innerHTML = data.theory;

            // Render Tasks
            const taskDiv = document.getElementById('task-container');
            taskDiv.innerHTML = '';
            data.tasks.forEach((t) => {
                taskDiv.innerHTML += `
                <label class="relative flex items-center cursor-pointer group">
                    <input type="checkbox" class="task-checkbox peer sr-only">
                    <div class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 flex items-start gap-3 transition-all hover:border-action peer-checked:shadow-sm">
                        <div class="mt-0.5 w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center bg-white peer-checked:bg-green-500 peer-checked:border-green-500 transition-all shrink-0">
                            <i class="fas fa-check text-white text-xs opacity-0 icon-check transition-all"></i>
                        </div>
                        <span class="text-sm text-slate-600 font-medium select-none leading-snug">${t}</span>
                    </div>
                </label>`;
            });

            // Render P5
            const p5Div = document.getElementById('p5-container');
            const p5Sec = document.getElementById('p5-section');
            p5Div.innerHTML = '';
            
            if(data.p5.length === 0) {
                p5Sec.classList.add('hidden');
            } else {
                p5Sec.classList.remove('hidden');
                data.p5.forEach(p => {
                    p5Div.innerHTML += `
                    <label class="block relative cursor-pointer">
                        <input type="checkbox" class="peer sr-only">
                        <div class="bg-white border border-slate-200 p-3 rounded-xl flex items-center gap-3 hover:bg-slate-50 peer-checked:bg-blue-50 peer-checked:border-blue-300 transition-all">
                            <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 peer-checked:bg-blue-500 peer-checked:text-white transition-all shrink-0">
                                <i class="fas ${p.icon}"></i>
                            </div>
                            <div>
                                <p class="font-bold text-slate-700 text-sm peer-checked:text-blue-800">${p.label}</p>
                                <p class="text-xs text-slate-500 leading-tight">${p.desc}</p>
                            </div>
                            <div class="ml-auto opacity-0 peer-checked:opacity-100 text-blue-500"><i class="fas fa-check-circle"></i></div>
                        </div>
                    </label>`;
                });
            }

            // Render Quiz
            const quizDiv = document.getElementById('quiz-area');
            quizDiv.innerHTML = '';
            score = 0;
            const letters = ['A','B','C','D','E'];
            
            data.quiz.forEach((q, idx) => {
                let opts = '';
                q.opt.forEach((o, oIdx) => {
                    opts += `
                    <button onclick="checkAnswer(this, ${idx}, ${oIdx}, ${q.ans})" class="q-btn-${idx} w-full text-left text-sm p-3 rounded-lg border border-slate-200 mb-2 hover:bg-slate-50 transition-all option-btn flex items-start gap-2 group">
                        <span class="font-bold text-slate-400 min-w-[20px] group-hover:text-action">${letters[oIdx]}.</span>
                        <span class="text-slate-700 font-medium">${o}</span>
                    </button>`;
                });
                quizDiv.innerHTML += `
                    <div class="border-b border-slate-100 pb-4 mb-2 last:border-0">
                        <p class="font-bold text-sm text-brand mb-3"><span class="bg-brand text-white px-2 py-0.5 rounded text-xs mr-2">No. ${idx+1}</span> ${q.q}</p>
                        ${opts}
                        <div id="fb-${idx}" class="hidden text-xs font-bold mt-2 p-2 rounded animate-pulse"></div>
                    </div>`;
            });

            document.getElementById('scroll-container').scrollTop = 0;
        }

        function checkAnswer(btn, qIdx, oIdx, ansIdx) {
            const btns = document.querySelectorAll(`.q-btn-${qIdx}`);
            btns.forEach(b => { b.disabled = true; b.classList.add('opacity-50', 'cursor-not-allowed'); });
            
            const fb = document.getElementById(`fb-${qIdx}`);
            fb.classList.remove('hidden');

            if(oIdx === ansIdx) {
                btn.classList.remove('opacity-50');
                btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                fb.innerHTML = "<i class='fas fa-check'></i> Benar! (+10)";
                fb.classList.add('bg-green-100', 'text-green-700');
                score += 10;
            } else {
                btn.classList.remove('opacity-50');
                btn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                btns[ansIdx].classList.remove('opacity-50');
                btns[ansIdx].classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                fb.innerHTML = "<i class='fas fa-times'></i> Salah.";
                fb.classList.add('bg-red-100', 'text-red-700');
            }
        }

        function kirimWA() {
            const nama = document.getElementById('nama').value;
            const kelas = document.getElementById('kelas').value;
            const absen = document.getElementById('absen').value;
            const story = document.getElementById('catatan').value || "Lancar jaya!";
            
            const tasksChecked = document.querySelectorAll('.task-checkbox:checked').length;
            const tasksTotal = document.querySelectorAll('.task-checkbox').length;
            
            const p5Checked = [];
            document.querySelectorAll('#p5-container input:checked').forEach(inp => {
                 p5Checked.push(inp.nextElementSibling.querySelector('p').innerText);
            });
            const p5String = p5Checked.length > 0 ? p5Checked.join(", ") : "-";

            const text = `*LAPORAN KD 3.7 (SENAM)* 🤸\n` +
                         `--------------------------\n` +
                         `👤 Nama: ${nama}\n` +
                         `🏫 Kelas: ${kelas} (${absen})\n` +
                         `📅 Materi: ${missions[activeMission].title}\n` +
                         `--------------------------\n` +
                         `✅ *Progress:* ${tasksChecked}/${tasksTotal} Item Selesai\n` +
                         `⭐ *Karakter:* ${p5String}\n` +
                         `💬 *Story:* "${story}"\n` +
                         `🏆 *Nilai Kuis:* ${score}/100\n` +
                         `--------------------------\n` +
                         `_Dikirim via App_`;
            
            window.open(`https://wa.me/6285709808532?text=${encodeURIComponent(text)}`);
        }
    </script>
</body>
</html>
