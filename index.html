        function loadMission(id) {
            activeTab = id;
            const data = missions[id];
            
            // Tab UI
            for(let i=1; i<=4; i++) {
                const btn = document.getElementById(`btn-${i}`);
                if(i === id) { btn.classList.add('active-tab'); btn.classList.remove('inactive-tab'); }
                else { btn.classList.remove('active-tab'); btn.classList.add('inactive-tab'); }
            }

            // Content
            document.getElementById('mission-title').innerText = data.title;
            const media = document.getElementById('media-container');
            // Using YouTube Embed with Start Time
            media.innerHTML = `<iframe class="w-full h-full" src="https://www.youtube.com/embed/${data.videoId}?start=${data.start}&rel=0" frameborder="0" allowfullscreen></iframe>`;
            
            document.getElementById('mission-desc').innerHTML = data.desc;
            document.getElementById('mission-theory').innerHTML = data.theory;

            // Checklist
            const taskDiv = document.getElementById('task-container');
            taskDiv.innerHTML = '';
            data.tasks.forEach(t => {
                taskDiv.innerHTML += `

                </label>`;
            });

                p5Div.innerHTML += `
                <label class="block relative cursor-pointer">
                    <input type="checkbox" class="peer sr-only">
                    <div class="bg-white border border-slate-200 p-3 rounded-xl flex items-center gap-3 hover:bg-slate-50 peer-checked:bg-blue-50 peer-checked:border-blue-300 transition-all">

            const letters = ['A','B','C','D','E'];
            data.quiz.forEach((q, idx) => {
                let opts = '';

                    opts += `<button onclick="checkAnswer(this, ${idx}, ${oIdx}, ${q.ans})" class="q-btn-${idx} w-full text-left text-xs p-2 rounded border border-slate-200 mb-1 hover:bg-slate-50 flex gap-2"><span class="font-bold text-slate-400 w-4">${letters[oIdx]}.</span><span>${o}</span></button>`;
                });
                quizDiv.innerHTML += `<div class="border-b border-slate-100 pb-3 mb-2"><p class="font-bold text-xs text-brand mb-2">${idx+1}. ${q.q}</p>${opts}<div id="fb-${idx}" class="hidden text-xs font-bold mt-1"></div></div>`;
            });

            document.getElementById('scroll-container').scrollTop = 0;

        function checkAnswer(btn, qIdx, oIdx, ansIdx) {
            const btns = document.querySelectorAll(`.q-btn-${qIdx}`);
            btns.forEach(b => { b.disabled = true; b.classList.add('opacity-50'); });
            const fb = document.getElementById(`fb-${qIdx}`);
            fb.classList.remove('hidden');
            if(oIdx === ansIdx) {
                btn.classList.remove('opacity-50'); btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                fb.innerHTML = "BENAR! (+10)"; fb.classList.add('text-green-600'); score += 10;
            } else {
                btn.classList.remove('opacity-50'); btn.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                fb.innerHTML = "SALAH."; fb.classList.add('text-red-600');
            }
