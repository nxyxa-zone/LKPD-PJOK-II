                                <p><strong>3. Double Step:</strong> Melangkah 2 kali ke samping kanan/kiri.</p>
                                <p><strong>4. Heel Touch:</strong> Menyentuhkan tumit ke lantai di depan badan.</p>
                                <p><strong>5. Toe Touch:</strong> Menyentuhkan ujung kaki ke depan atau belakang.</p>
                                <p><strong>6. Single Lunge:</strong> Memindahkan kaki ke samping/belakang, lutut ditekuk.</p>
                                <p><strong>7. Double Lunge:</strong> Lunge 2 kali berturut-turut di sisi yang sama.</p>
                                <p><strong>8. Squat:</strong> Membuka kaki lebar, menekuk kedua lutut seperti duduk.</p>
                                <p><strong>9. Knee Up:</strong> Mengangkat lutut tinggi minimal setinggi pinggang.</p>
                                <p><strong>10. Leg Curl:</strong> Menekuk kaki ke arah bokong (belakang).</p>

                                <p><strong>13. Forwards & Backwards:</strong> Berjalan/langkah maju dan mundur (biasanya 4 hitungan).</p>
                                <p><strong>14. Cha Cha Cha:</strong> Langkah cepat ritmis (hitungan 1, 2, 3-dan-4).</p>
                                <p><strong>15. Diagonal:</strong> Melangkah serong ke pojok depan.</p>
